# pplr -- devbin configuration.
#
# Written by: devbin install. Every key, annotated, is vendored beside this
# file at bin/.devbin/lib/config.reference.yaml.

project:
  name: pplr
  # Cargo.toml is the one version source (ST0001 D7); Cargo.lock follows through bin/devbin lock-sync
  version_from: Cargo.toml
  languages:
    - rust
    - shell

# The devbin this project expects. Enforced by: devbin doctor
devbin_version: "^0.1.19"

commands:
  check:
    options:
      nopython:
        summary: no Python in what the repository tracks (ST0001 AC-00.1)
        run: bin/.devbin/cmd/nopython
        grammar: generic
        log: NOPYTHON
  test:
    options:
      shell:
        summary: the bats suite against the Rust pplr, built first (ST0001 design D3)
        run: bin/.devbin/cmd/bats-rust
        grammar: bats
        log: BATS
  release:
    enabled: true
  formula:
    enabled: true

# The release core (ST0002 E3 and install-release.md section 5). Outward steps
# (tag, push, release, tap) run only in ST0002 WP06, with hv's approval (E8).
release:
  repo: matthewsinclair/pplr
  remotes:
    - local
    - upstream
  branch: main
  notes:
    kind: changelog
  derived:
    - bin/devbin lock-sync
  gates:
    - check all
    - test all
    - doctor
  legs:
    - kovacs
  ci:
    workflow: tests.yml
  object: local
  after:
    - bin/devbin formula publish

# The Homebrew formula: signed release assets (ST0002 E1), from the template
# packaging/homebrew/pplr.rb.
formula:
  mode: assets
  assets:
    - "pplr-{version}-aarch64-apple-darwin.tar.gz"
    - "pplr-{version}-x86_64-unknown-linux-musl.tar.gz"
    - "pplr-{version}-aarch64-unknown-linux-musl.tar.gz"
  bin:
    - bin/pplr
