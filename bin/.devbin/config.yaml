# pplr -- devbin configuration.
#
# Written by: devbin install. Every key, annotated, is vendored beside this
# file at bin/.devbin/lib/config.reference.yaml.

project:
  name: pplr
  # Cargo.toml is the one version source (ST0001 D7); Cargo.lock follows through bin/devbin lock-sync
  version_from: Cargo.toml
  languages:
    - rust
    - shell

# The devbin this project expects. Enforced by: devbin doctor
devbin_version: "^0.1.19"

commands:
  check:
    options:
      nopython:
        summary: no Python in what the repository tracks (ST0001 AC-00.1)
        run: bin/.devbin/cmd/nopython
        grammar: generic
        log: NOPYTHON
  test:
    options:
      shell:
        summary: the bats suite against the Rust pplr, built first (ST0001 design D3)
        run: bin/.devbin/cmd/bats-rust
        grammar: bats
        log: BATS
  release:
    enabled: true
  formula:
    enabled: true

# The release core (ST0002 E3). bin/devbin release vX.Y.Z is the whole release:
# after: is one line, bin/devbin post-cut, which builds, signs, notarises and
# attaches the macOS asset and then publishes the formula, stopping at the
# first failure (one line, since the core runs every after: line even when one
# before it failed).
release:
  repo: matthewsinclair/pplr
  remotes:
    - local
    - upstream
  branch: main
  notes:
    kind: changelog
  derived:
    - bin/devbin lock-sync
  gates:
    - check all
    - test all
    - doctor
  ci:
    workflow: tests.yml
  object: local
  after:
    - bin/devbin post-cut

# The Homebrew formula: the signed macOS release asset (ST0002 E1), from the
# template packaging/homebrew/pplr.rb. The Linux tarballs join it in a later
# release, with the workflow that builds them.
formula:
  mode: assets
  assets:
    - "pplr-{version}-aarch64-apple-darwin.tar.gz"
  bin:
    - bin/pplr
