[package]
name = "pplr"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/matthewsinclair/pplr"
description = "A personal relationship manager over a plain-text People tree"

[dependencies]
# The Contacts dump format (the sidecar's output and the JSON store), read and written.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local time for backup names, as the engine stamps them (and, later, every date).
jiff = "0.2"
# The install manifest's sha256 lines (devbin T3), as `shasum -a 256` writes them.
sha2 = "0.10"
# The engine's email pattern in About headers, and pplr grep's basic regular expressions.
regex = "1"
# sync --plan's review workbook, written (ST0001 WP11).
rust_xlsxwriter = { version = "0.102.0", default-features = false }
# The reviewed workbook, read back by sync --apply-plan.
calamine = { version = "0.38.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = "line-tables-only"
