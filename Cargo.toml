[package]
name = "pplr"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/matthewsinclair/pplr"
description = "A personal relationship manager over a plain-text People tree"

[dependencies]
# The Contacts dump format (the sidecar's output and the JSON store), read and written.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local time for backup names, as the engine stamps them (and, later, every date).
jiff = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = "line-tables-only"
